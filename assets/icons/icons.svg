<!-- ========================================
     ICONS.SVG - Sistema de Iconos SVG
     ========================================
     Este archivo contiene todos los iconos del proyecto
     como symbols SVG para optimizar el DOM.
     
     Uso: <svg><use href="assets/icons/icons.svg#nombre-icono"/></svg>
     ======================================== -->

<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
